<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Holder</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        color: #333;
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 20px;
      }

      .pdf-frame {
        width: 100%;
        height: 80vh;
        border: 1px solid #ccc;
        background: #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      .download-link {
        display: inline-block;
        margin-top: 16px;
        text-decoration: none;
        color: #0056b3;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>AI Proyects Certificate </h2>
      <h3>Harvard University Certificates can be verified at the official Harvard website by using the QR code.</h3>

      <object class="pdf-frame" data="your-file.pdf" type="application/pdf">
        <p>
          Your browser does not support PDF preview. You can
          <a href="CS50AI.pdf" target="_blank">download the PDF</a>.
        </p>
      </object>

      <a class="download-link" href="CS50AI.pdf" target="_blank">Download PDF</a>
    </div>
  </body>
</html>
